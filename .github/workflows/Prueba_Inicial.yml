name: Runner Watchdog (SSH)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *" 

jobs:
  recover:
    runs-on:
      labels: [self-hosted, windows, watchdog]
    env:
      SSH_USER: ${{ vars.SSH_USER }}
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_PASS: ${{ secrets.SSH_PASS }}
    steps:
      - name: Instalar Posh-SSH
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable Posh-SSH)) {
            Install-Module Posh-SSH -Scope CurrentUser -Force -AllowClobber
          }

      - name: Revisar y levantar servicios de runners por SSH
        shell: powershell
        run: |
          Import-Module Posh-SSH
          $sec  = ConvertTo-SecureString $env:SSH_PASS -AsPlainText -Force
          $cred = New-Object PSCredential($env:SSH_USER, $sec)

          # Script que se ejecuta en el servidor remoto
          $remote = @'
          $svcs = Get-Service -Name 'actions.runner.*'
          foreach ($s in $svcs) {
            if ($s.Status -ne 'Running') {
              Write-Output ("Levantando " + $s.Name + " (estaba " + $s.Status + ")")
              Start-Service -Name $s.Name
            }
          }
          Get-Service -Name 'actions.runner.*' | ForEach-Object { $.Name + ': ' + $.Status }
          '@
          # EncodedCommand evita problemas de comillas (el shell por defecto remoto es cmd)
          $enc = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($remote))

          $session = New-SSHSession -ComputerName $env:SSH_HOST -Credential $cred -AcceptKey -ErrorAction Stop
          try {
            $r = Invoke-SSHCommand -SessionId $session.SessionId -Command "powershell -NoProfile -EncodedCommand $enc"
            $r.Output | Tee-Object -Variable out
            "### Servicios de runners" >> $env:GITHUB_STEP_SUMMARY
            $out | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY
            if ($r.ExitStatus -ne 0) { Write-Error $r.Error; exit 1 }
          } finally {
            Remove-SSHSession -SessionId $session.SessionId | Out-Null
          }
